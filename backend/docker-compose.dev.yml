# Chạy dev có hot reload: docker compose -f docker-compose.dev.yml up
services:
  app:
    image: golang:1.22-alpine
    container_name: wedding-invitation-dev
    working_dir: /src
    command: sh -c "go install github.com/air-verse/air@v1.52.3 && air -c .air.toml"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod

volumes:
  go-mod-cache:
